---
- project:
    vars:
      ensure_tox_version: '<4'
    check:
      jobs:
        - openstack-tox-linters
        - k8sapp-cert-mgr-tox-py39
        - k8sapp-cert-mgr-tox-flake8
        - k8sapp-cert-mgr-tox-pylint
        - k8sapp-cert-mgr-tox-metadata
        - k8sapp-cert-mgr-tox-bandit
        - k8sapp-cert-mgr-tox-coverage
        - k8sapp-cert-mgr-tox-security
        - k8sapp-cert-mgr-tox-py313
        - k8sapp-cert-mgr-tox-coverage-trixie
        - k8sapp-cert-mgr-tox-security-trixie
        - k8sapp-cert-mgr-tox-flake8-trixie
        - k8sapp-cert-mgr-tox-pylint-trixie
    gate:
      jobs:
        - openstack-tox-linters
        - k8sapp-cert-mgr-tox-py39
        - k8sapp-cert-mgr-tox-flake8
        - k8sapp-cert-mgr-tox-pylint
        - k8sapp-cert-mgr-tox-metadata
        - k8sapp-cert-mgr-tox-bandit
        - k8sapp-cert-mgr-tox-coverage
        - k8sapp-cert-mgr-tox-security
        - k8sapp-cert-mgr-tox-py313
        - k8sapp-cert-mgr-tox-coverage-trixie
        - k8sapp-cert-mgr-tox-security-trixie
        - k8sapp-cert-mgr-tox-flake8-trixie
        - k8sapp-cert-mgr-tox-pylint-trixie
    post:
      jobs:
        - stx-cert-manager-armada-app-upload-git-mirror

- job:
    name: k8sapp-cert-mgr-tox-py39
    parent: openstack-tox-py39
    description: |
            Run py39 test for k8sapp_dell_storage
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-cert-manager/*
    vars:
      tox_extra_args: -c python3-k8sapp-cert-manager/k8sapp_cert_manager/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

# NOTE: A Trixie-specific metadata job is not needed because the metadata
# test validates app metadata YAML structure which is Python-version agnostic.
# It does not depend on Python runtime behavior that differs between 3.9/3.13.
- job:
    name: k8sapp-cert-mgr-tox-metadata
    nodeset: debian-bullseye
    parent: tox
    description: |
      Run metadata test for k8sapp-cert-manager
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    vars:
      tox_envlist: metadata
      tox_extra_args: -c python3-k8sapp-cert-manager/k8sapp_cert_manager/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-cert-mgr-tox-pylint
    parent: tox
    description: |
      Run pylint test for k8sapp-cert-manager
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-cert-manager/*
    vars:
      tox_envlist: pylint
      tox_extra_args: -c python3-k8sapp-cert-manager/k8sapp_cert_manager/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-cert-mgr-tox-flake8
    parent: tox
    description: |
      Run flake8 test for k8sapp-cert-manager
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-cert-manager/*
    vars:
      tox_envlist: flake8
      tox_extra_args: -c python3-k8sapp-cert-manager/k8sapp_cert_manager/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-cert-mgr-tox-bandit
    parent: tox
    description: |
      Run bandit test for k8sapp-cert-manager
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-cert-manager/*
