      tox_envlist: bandit
      tox_extra_args: -c python3-k8sapp-cert-manager/k8sapp_cert_manager/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'

- job:
    name: k8sapp-cert-mgr-tox-coverage
    parent: tox
    description: |
      Run all tests with coverage analysis for k8sapp-cert-manager
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-cert-manager/*
    vars:
      tox_envlist: coverage
      tox_extra_args: -c python3-k8sapp-cert-manager/k8sapp_cert_manager/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/upper-constraints.txt'
    post-run: playbooks/upload-coverage-reports.yaml

- job:
    name: k8sapp-cert-mgr-tox-security
    parent: tox
    description: |
      Run security analysis for k8sapp-cert-manager
    nodeset: debian-bullseye
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-cert-manager/*
