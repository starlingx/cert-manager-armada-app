    post-run: playbooks/upload-security-reports.yaml

- job:
    name: k8sapp-cert-mgr-tox-py313
    parent: tox
    description: |
      Run py313 for k8sapp-cert-manager
    nodeset: debian-trixie-8GB
    required-projects:
      - starlingx/config
      - starlingx/fault
      - starlingx/utilities
      - starlingx/root
    files:
      - python3-k8sapp-cert-manager/*
    vars:
      # Override project-level ensure_tox_version '<4' to use Trixie system tox 4.x
      ensure_tox_version: ''
      tox_envlist: py313
      tox_extra_args: -c python3-k8sapp-cert-manager/k8sapp_cert_manager/tox.ini
      tox_constraints_file: '{{ ansible_user_dir }}/src/opendev.org/starlingx/root/build-tools/requirements/debian/trixie/upper-constraints.txt'

